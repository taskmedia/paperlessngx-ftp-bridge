apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ include "plngxftpbridge.fullname" . }}"
  labels:
    {{- include "plngxftpbridge.labels" . | nindent 4 }}
spec:
  # Hardcoded, not a .Values knob: PASV session affinity can't survive more
  # than one replica behind an L4 passthrough LoadBalancer (see ADR-0006).
  replicas: 1
  selector:
    matchLabels:
      {{- include "plngxftpbridge.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        secrets-hash: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "plngxftpbridge.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: bridge
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.Version) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Fully locked down: nothing in the request path touches a real
          # filesystem (in-memory ClientDriver, in-memory or read-only
          # mounted TLS certs -- see ADR-0001/0003/0006).
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: ftp-control
              containerPort: 2121
              protocol: TCP
            {{- range $port := include "plngxftpbridge.pasvPorts" . | splitList " " }}
            - name: ftp-pasv-{{ $port }}
              containerPort: {{ $port }}
              protocol: TCP
            {{- end }}
          env:
            - name: LOG_LEVEL
              value: "{{ .Values.logLevel }}"
            {{- range $i, $account := .Values.ftp.accounts }}
            {{- $username := required (printf "ftp.accounts[%d].username is required" $i) $account.username }}
            {{- if not (regexMatch "^[A-Za-z0-9_]+$" $username) }}
            {{- fail (printf "ftp.accounts[%d].username %q must contain only letters, digits, and underscores" $i $username) }}
            {{- end }}
            {{- $existingSecret := $account.passwordExistingSecret | default dict }}
            - name: FTP_ACCOUNT_{{ $username }}
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "plngxftpbridge.fullname" $) $existingSecret.name }}
                  key: {{ default (printf "ftp-account-%d-password" $i) $existingSecret.key }}
            {{- end }}
            - name: FTP_ALLOWED_EXTENSIONS
              value: "{{ join "," .Values.ftp.allowedExtensions }}"
            - name: FTP_PASV_PORT_MIN
              value: "{{ .Values.ftp.pasv.portMin }}"
            - name: FTP_PASV_PORT_MAX
              value: "{{ .Values.ftp.pasv.portMax }}"
            - name: FTP_PASV_PUBLIC_HOST
              value: "{{ required "ftp.pasv.publicHost is required" .Values.ftp.pasv.publicHost }}"
            - name: PAPERLESS_URL
              value: "{{ .Values.paperless.url }}"
            - name: PAPERLESS_USER
              value: "{{ required "paperless.username is required" .Values.paperless.username }}"
            - name: PAPERLESS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "plngxftpbridge.fullname" .) .Values.paperless.passwordExistingSecret.name }}
                  key: {{ default "paperless-password" .Values.paperless.passwordExistingSecret.key }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          {{- with .Values.ftp.tls.existingSecret.name }}
          volumeMounts:
            - name: ftp-tls
              mountPath: /etc/ftp/tls
              readOnly: true
          {{- end }}
      {{- with .Values.ftp.tls.existingSecret.name }}
      volumes:
        - name: ftp-tls
          secret:
            secretName: {{ . }}
      {{- end }}
      restartPolicy: Always
