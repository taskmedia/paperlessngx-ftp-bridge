apiVersion: v1
kind: Service
metadata:
  name: "{{ include "plngxftpbridge.fullname" . }}"
  labels:
    {{- include "plngxftpbridge.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # Hardcoded, not a .Values knob: the control connection and every PASV
  # data connection must land on the same pod and be reachable at the one
  # address advertised as ftp.pasv.publicHost, so both are carried on a
  # single Service. NodePort can't sanely carry the ~20 PASV ports below
  # (see ADR-0006).
  type: LoadBalancer
  {{- with .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  selector:
    {{- include "plngxftpbridge.selectorLabels" . | nindent 4 }}
  ports:
    - name: ftp-control
      port: 21
      targetPort: 2121
      protocol: TCP
    {{- range $port := include "plngxftpbridge.pasvPorts" . | splitList " " }}
    - name: ftp-pasv-{{ $port }}
      port: {{ $port }}
      targetPort: {{ $port }}
      protocol: TCP
    {{- end }}
