# values used by `ct install` in CI (see .github/workflows/test-helm.yaml).
# paperless.url points at the bridge's own health-check server rather than a
# real paperless-ngx: Client.Ping() only cares that the HTTP request
# succeeds at all (any response, even a 404, counts as reachable -- see
# internal/paperless/client.go), so this is a side-effect-free, always
# reachable stand-in that keeps /readyz non-flaky without standing up a
# second service.
ftp:
  accounts:
    - username: ctuser
      password: ct-test-password
  # ftpserverlib requires a real IP here, not a hostname.
  pasv:
    publicHost: 127.0.0.1

paperless:
  url: "http://localhost:8080"
  username: ctuser
  password: ct-test-password

# No release has been cut since the embedded-FTP-server rewrite, so the
# published ghcr.io image still predates it (it crashes on the old env var
# schema). The workflow builds the current code into this exact
# repository:tag and `kind load docker-image`s it so ct install exercises
# the binary this PR actually ships, not the stale release.
image:
  repository: paperlessngx-ftp-bridge-image
  tag: ct
  pullPolicy: Never
