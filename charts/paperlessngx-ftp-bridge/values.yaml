# logLevel for the bridge - DEBUG, INFO, WARNING, ERROR
logLevel: INFO

# ftp configuration for the embedded FTP/FTPS server scanners connect to
# directly (see ADR-0001/0002/0003 for the design behind this schema)
ftp:
  # accounts accepted by the embedded FTP server. Usernames must be
  # env-var-safe (letters, digits, underscore only) -- the chart fails to
  # render otherwise. Add a second scanner by appending another entry; no
  # code change is required.
  accounts:
    - username: ""
      # password for this FTP account
      password: ""
      # passwordExistingSecret is used to reference an existing secret in the same namespace
      passwordExistingSecret:
        name: ""
        key: ""

  # file extensions accepted by STOR, including the leading dot
  allowedExtensions:
    - ".pdf"

  # passive-mode (PASV) data connection configuration
  pasv:
    # port range advertised for passive data connections
    portMin: 50000
    portMax: 50019
    # publicHost is the IP/host advertised to clients for PASV data
    # connections. Required for scanners behind NAT to reach the data
    # channel -- there is no default or auto-inference.
    publicHost: ""

  # TLS certificate for explicit FTPS (AUTH TLS), always offered alongside
  # plain FTP (see ADR-0003). Leave existingSecret.name empty to use the
  # self-signed certificate generated in memory at startup.
  tls:
    existingSecret:
      # name of an existing kubernetes.io/tls Secret (tls.crt/tls.key) in
      # this release's namespace. When set, it is mounted read-only at the
      # fixed path /etc/ftp/tls; when empty, no volume is created at all.
      name: ""

# service configures the single LoadBalancer Service that carries both the
# FTP control port and the full PASV range (see ADR-0006). service.type is
# hardcoded to LoadBalancer in the template, not a value here.
service:
  # loadBalancerIP pins a stable external IP -- set this to match
  # ftp.pasv.publicHost on platforms that don't assign one automatically.
  loadBalancerIP: ""
  annotations: {}

# paperless-ngx configuration to send documents to
paperless:
  # url with protocol but no API endpoint
  url: "http://paperless-ngx:8000"
  username: ""
  # password for paperless-ngx
  password: ""
  # passwordExistingSecret is used to reference an existing secret in the same namespace
  passwordExistingSecret:
    name: ""
    key: ""

# image used for bridge
image:
  repository: ghcr.io/taskmedia/paperlessngx-ftp-bridge-image
  tag: ""
  pullPolicy: Always

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}
