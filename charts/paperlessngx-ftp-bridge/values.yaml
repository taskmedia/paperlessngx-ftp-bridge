# logLevel for the bridge - DEBUG, INFO, WARNING, ERROR
logLevel: INFO

# ftp configuration for the embedded FTP/FTPS server scanners connect to
# directly (see ADR-0001/0002/0003 for the design behind this schema)
ftp:
  # accounts accepted by the embedded FTP server. Usernames must be
  # env-var-safe (letters, digits, underscore only) -- the chart fails to
  # render otherwise. Add a second scanner by appending another entry; no
  # code change is required.
  accounts:
    - username: ""
      # password for this FTP account
      password: ""
      # passwordExistingSecret is used to reference an existing secret in the same namespace
      passwordExistingSecret:
        name: ""
        key: ""

  # file extensions accepted by STOR, including the leading dot
  allowedExtensions:
    - ".pdf"

  # passive-mode (PASV) data connection configuration
  pasv:
    # port range advertised for passive data connections
    portMin: 50000
    portMax: 50019
    # publicHost is the IP/host advertised to clients for PASV data
    # connections. Required for scanners behind NAT to reach the data
    # channel -- there is no default or auto-inference.
    publicHost: ""

# paperless-ngx configuration to send documents to
paperless:
  # url with protocol but no API endpoint
  url: "http://paperless-ngx:8000"
  username: ""
  # password for paperless-ngx
  password: ""
  # passwordExistingSecret is used to reference an existing secret in the same namespace
  passwordExistingSecret:
    name: ""
    key: ""

# image used for bridge
image:
  repository: ghcr.io/taskmedia/paperlessngx-ftp-bridge-image
  tag: ""
  pullPolicy: Always

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}
