name: Release
# Releases are immutable: assets must be attached while the release is still a
# draft. release-please creates the draft, the build jobs attach to it, and the
# final job publishes it.
on:
  push:
    branches: [main]
jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.repository == 'taskmedia/paperlessngx-ftp-bridge'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-image:
    needs: release-please
    runs-on: ubuntu-latest
    if: github.repository == 'taskmedia/paperlessngx-ftp-bridge' && needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write
    env:
      # Use docker.io for Docker Hub if empty
      REGISTRY: ghcr.io
      # github.repository as <account>/<repo>
      IMAGE_NAME: taskmedia/paperlessngx-ftp-bridge-image

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      # Workaround: https://github.com/docker/build-push-action/issues/461
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=${{ needs.release-please.outputs.tag_name }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: |
            linux/386
            linux/amd64
            linux/arm64
            linux/ppc64le
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            fty4/paperlessngx-ftp-bridge-image:${{ needs.release-please.outputs.tag_name }}
            ghcr.io/taskmedia/paperlessngx-ftp-bridge-image:latest
            fty4/paperlessngx-ftp-bridge-image:main
            fty4/paperlessngx-ftp-bridge-image:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        env:
          COSIGN_EXPERIMENTAL: "true"
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${{ steps.meta.outputs.tags }}" | xargs -I {} cosign sign --yes --tlog-upload=false {}@${{ steps.build-and-push.outputs.digest }}

      - name: Get repository name
        env:
          REPOSITORY_NAME: ${{ env.IMAGE_NAME }}
        run: echo "REPOSITORY_NAME=${REPOSITORY_NAME#*/}" >> $GITHUB_ENV

      # Clean up legacy images from ghcr.io
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.REPOSITORY_NAME }}
          package-type: "container"
          min-versions-to-keep: 200
          delete-only-untagged-versions: "true"

  build-binaries:
    name: Build binaries for release
    needs: release-please
    runs-on: ubuntu-latest
    if: github.repository == 'taskmedia/paperlessngx-ftp-bridge' && needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Build binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -o ./bin/paperlessngx-ftp-bridge-linux-amd64
          GOOS=linux GOARCH=arm64 go build -o ./bin/paperlessngx-ftp-bridge-linux-arm64
          GOOS=linux GOARCH=arm go build -o ./bin/paperlessngx-ftp-bridge-linux-arm
          GOOS=linux GOARCH=386 go build -o ./bin/paperlessngx-ftp-bridge-linux-386

          # macOS with Intel CPU
          GOOS=darwin GOARCH=amd64 go build -o ./bin/paperlessngx-ftp-bridge-darwin-amd64
          # macOS with Apple Silicon CPU
          GOOS=darwin GOARCH=arm64 go build -o ./bin/paperlessngx-ftp-bridge-darwin-arm64

          GOOS=windows GOARCH=amd64 go build -o ./bin/paperlessngx-ftp-bridge-windows-amd64.exe
          GOOS=windows GOARCH=386 go build -o ./bin/paperlessngx-ftp-bridge-windows-386.exe

      - name: Upload artifacts to existing release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          draft: true
          files: |
            ./bin/paperlessngx-ftp-bridge-linux-amd64
            ./bin/paperlessngx-ftp-bridge-linux-arm64
            ./bin/paperlessngx-ftp-bridge-linux-arm
            ./bin/paperlessngx-ftp-bridge-linux-386
            ./bin/paperlessngx-ftp-bridge-darwin-amd64
            ./bin/paperlessngx-ftp-bridge-darwin-arm64
            ./bin/paperlessngx-ftp-bridge-windows-amd64.exe
            ./bin/paperlessngx-ftp-bridge-windows-386.exe

  publish-release:
    needs: [release-please, build-image, build-binaries]
    runs-on: ubuntu-latest
    if: github.repository == 'taskmedia/paperlessngx-ftp-bridge'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      # Drafts are not resolvable by tag via the tags endpoint, so find the id in the release list.
      # target_commitish pins the tag GitHub creates on publish to the built commit.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          RELEASE_ID=$(gh api --paginate "repos/${{ github.repository }}/releases" \
            -q ".[] | select(.draft and .tag_name == \"${TAG_NAME}\") | .id")
          test -n "${RELEASE_ID}"
          gh api --method PATCH "repos/${{ github.repository }}/releases/${RELEASE_ID}" \
            -F draft=false -f target_commitish="${RELEASE_SHA}"

      - name: update latest tag
        run: |
          git tag --force latest "${{ needs.release-please.outputs.sha }}"
          git push --force origin latest

  bump-helm-chart:
    name: Open chart bump PR in taskmedia/helm
    needs: [release-please, publish-release]
    runs-on: ubuntu-latest
    if: github.repository == 'taskmedia/paperlessngx-ftp-bridge' && needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    env:
      HELM_REPO: taskmedia/helm
      CHART_FILE: charts/paperlessngx-ftp-bridge/Chart.yaml
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      # The token must come from an app (or PAT), not GITHUB_TOKEN: PRs opened
      # with GITHUB_TOKEN do not trigger the helm repo's lint-test workflow.
      - name: Create helm repo token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.HELM_BRIDGE_APP_ID }}
          private-key: ${{ secrets.HELM_BRIDGE_APP_PRIVATE_KEY }}
          owner: taskmedia
          repositories: helm

      - name: Checkout helm repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.HELM_REPO }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Bump appVersion and chart version
        id: bump
        run: |
          APP_VERSION="${TAG_NAME#v}"
          CURRENT_APP_VERSION=$(yq '.appVersion' "${CHART_FILE}")
          if [ "${CURRENT_APP_VERSION}" = "${APP_VERSION}" ]; then
            echo "appVersion already ${APP_VERSION}, nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHART_VERSION=$(yq '.version' "${CHART_FILE}")
          NEW_CHART_VERSION="${CHART_VERSION%.*}.$(( ${CHART_VERSION##*.} + 1 ))"

          # sed keeps the comments in Chart.yaml intact, unlike a yq rewrite
          sed -i -E "s/^appVersion: .*/appVersion: \"${APP_VERSION}\"/" "${CHART_FILE}"
          sed -i -E "s/^version: .*/version: ${NEW_CHART_VERSION}/" "${CHART_FILE}"

          {
            echo "changed=true"
            echo "app_version=${APP_VERSION}"
            echo "chart_version=${NEW_CHART_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_VERSION: ${{ steps.bump.outputs.app_version }}
          CHART_VERSION: ${{ steps.bump.outputs.chart_version }}
        run: |
          BRANCH="chore/paperlessngx-ftp-bridge-${APP_VERSION}"

          if [ -n "$(gh pr list --repo "${HELM_REPO}" --head "${BRANCH}" --state all --json number --jq '.[].number')" ]; then
            echo "PR for ${BRANCH} already exists, skipping"
            exit 0
          fi

          git config user.name "paperlessngx-ftp-bridge release bot"
          git config user.email "noreply@github.com"
          git checkout -b "${BRANCH}"
          git add "${CHART_FILE}"
          git commit -m "chore(paperlessngx-ftp-bridge): bump app to ${APP_VERSION}"
          git push origin "${BRANCH}"

          gh pr create --repo "${HELM_REPO}" --head "${BRANCH}" --base main \
            --title "chore(paperlessngx-ftp-bridge): bump app to ${APP_VERSION}" \
            --body "Automated bump after [${TAG_NAME}](https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}).

          - \`appVersion\`: ${APP_VERSION}
          - chart \`version\`: ${CHART_VERSION}

          Review the [release notes](https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}) for values or config changes before merging. Merging publishes the chart."
